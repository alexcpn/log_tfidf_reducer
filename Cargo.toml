[package]
name = "logreduce"
version = "0.2.0"
edition = "2021"

[[bin]]
name = "logreduce"
path = "src/main.rs"

[lib]
name = "logreduce"
path = "src/lib.rs"

[[bench]]
name = "reduce_bench"
harness = false

[dependencies]
clap = { version = "4", features = ["derive"] }
rayon = "1"
regex = "1"
memmap2 = "0.9"
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiktoken-rs = "0.6"
once_cell = "1"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[profile.release]
opt-level = 3
lto = true
